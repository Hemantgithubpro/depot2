default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
development:
  <<: *default
  database: depot2_development

test:
  <<: *default
  database: depot2_test

production:
  primary: &primary_production
    <<: *default
    database: depot2_production
    username: depot2
    password: <%= ENV["DEPOT2_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: depot2_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: depot2_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: depot2_production_cable
    migrations_paths: db/cable_migrate
